<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Piiicker — Пикер</title>
<link rel="stylesheet" href="/shared.css">
</head>
<body>

<h1>
  📝 Пикер
  <span class="who" id="who">…</span>
  <span class="dev" id="dev"></span>
  <span class="count">Записано: <b id="cnt">0</b></span>
  <div class="menu-wrap">
    <button class="b-menu" onclick="toggleMenu(event)">☰</button>
    <div class="menu" id="menu">
      <a href="/tsd" class="current">📝 Пикер</a>
      <a href="/compare">🔍 Проверки</a>
      <div class="item" onclick="switchUser()">👤 Сменить пользователя</div>
    </div>
  </div>
</h1>

<input type="text" id="scan" class="scan"
       placeholder="Пикайте что угодно…"
       autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

<div class="toolbar">
  <button class="b-numpad" id="btnNumpad" onclick="toggleNumpad()">🔢 Цифры</button>
  <button class="b-undo" onclick="undoLast()">↩️ Удалить последнюю</button>
</div>

<div class="status" id="status"><span id="statusText">Подключение…</span></div>

<div class="numpad" id="numpad" style="display:none">
  <div class="numpad-grid">
    <button class="numpad-btn" data-k="7">7</button>
    <button class="numpad-btn" data-k="8">8</button>
    <button class="numpad-btn" data-k="9">9</button>
    <button class="numpad-btn" data-k="4">4</button>
    <button class="numpad-btn" data-k="5">5</button>
    <button class="numpad-btn" data-k="6">6</button>
    <button class="numpad-btn" data-k="1">1</button>
    <button class="numpad-btn" data-k="2">2</button>
    <button class="numpad-btn" data-k="3">3</button>
    <button class="numpad-btn numpad-bs"    data-k="bs"    aria-label="Удалить">⌫</button>
    <button class="numpad-btn" data-k="0">0</button>
    <button class="numpad-btn numpad-enter" data-k="enter" aria-label="Ввод">⏎</button>
  </div>
</div>

<table>
  <thead><tr><th class="time">Время</th><th>Значение</th></tr></thead>
  <tbody id="tbody">
    <tr class="empty"><td colspan="2">Пока ничего не записано</td></tr>
  </tbody>
</table>
<div class="more" id="more" style="display:none"></div>

<script>
const STORE = 'piiicker_entries';
const NUMPAD_KEY = 'piiicker_numpad';
const DEV_KEY = 'piiicker_device';
const DIAG_KEY = 'piiicker_diag';
const RENDER_LIMIT = 200;
const RETRY_MS = 8000;
const NET_TIMEOUT = 5000;

let deviceId = localStorage.getItem(DEV_KEY);
if (!deviceId) {
  const r = () => Math.random().toString(36).slice(2, 6).toUpperCase();
  deviceId = r() + '-' + r();
  localStorage.setItem(DEV_KEY, deviceId);
}
document.getElementById('dev').textContent = deviceId;

let entries = [];
let employee = { code: '—', name: '' };
let catalogRows = {};
let catalogNameCol = '';
let wasOffline = false;
let diagQueue = [];

const input     = document.getElementById('scan');
const tbody     = document.getElementById('tbody');
const cntEl     = document.getElementById('cnt');
const statusEl  = document.getElementById('status');
const statusTxt = document.getElementById('statusText');
const whoEl     = document.getElementById('who');
const moreEl    = document.getElementById('more');
const numpad    = document.getElementById('numpad');
const btnNumpad = document.getElementById('btnNumpad');
const menu      = document.getElementById('menu');

function pad(n) { return n < 10 ? '0' + n : n; }
function now() {
  const d = new Date();
  const ms = String(d.getMilliseconds()).padStart(3, '0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) +
    ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '.' + ms;
}
function hhmmss() {
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function beep(high) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(high ? 880 : 400, ctx.currentTime);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.12);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.12);
  } catch (e) {}
}
function focusInput() {
  if (document.activeElement !== input) input.focus();
}
async function fetchT(url, opts = {}, ms = NET_TIMEOUT) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    return await fetch(url, Object.assign({}, opts, {
      credentials: 'same-origin',
      signal: ctrl.signal,
      headers: Object.assign({ 'X-Device-Id': deviceId }, (opts.headers || {}))
    }));
  } finally {
    clearTimeout(t);
  }
}
function lookup(code) {
  const r = catalogRows[code];
  if (!r || !catalogNameCol) return '';
  return r[catalogNameCol] || '';
}
function saveEntries() {
  try { localStorage.setItem(STORE, JSON.stringify(entries)); } catch (e) {}
}
function loadEntries() {
  try {
    const raw = localStorage.getItem(STORE);
    entries = raw ? JSON.parse(raw) : [];
  } catch (e) { entries = []; }
}
function saveDiag() {
  try { localStorage.setItem(DIAG_KEY, JSON.stringify(diagQueue)); } catch (e) {}
}
function loadDiag() {
  try {
    const raw = localStorage.getItem(DIAG_KEY);
    diagQueue = raw ? JSON.parse(raw) : [];
  } catch (e) { diagQueue = []; }
}
function queueDiag(op) {
  diagQueue.push({ op, detail: '' });
  saveDiag();
}
async function flushDiag() {
  if (!diagQueue.length) return;
  try {
    const r = await fetchT('/api/diag', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ events: diagQueue })
    });
    if (r.ok) { diagQueue = []; saveDiag(); }
  } catch (e) {}
}
function setStatus(kind, text) {
  statusEl.className = 'status ' + kind;
  statusTxt.textContent = text;
}
function statusOk() {
  setStatus('ok', '✅ Сохранено в ' + hhmmss() + ' · ' + (employee.name || employee.code));
}
function statusSaving() { setStatus('warn', '⏳ Сохранение…'); }
function statusOffline() {
  const pend = entries.filter(e => !e.synced).length;
  setStatus('err', '❌ Нет связи с сервером' +
    (pend ? ' · в очереди: ' + pend : '') + '. Повтор автоматически…');
}
function render(mode) {
  cntEl.textContent = entries.length;
  whoEl.textContent = employee.name || 'Сотрудник';
  if (!entries.length) {
    tbody.innerHTML = '<tr class="empty"><td colspan="2">Пока ничего не записано</td></tr>';
    moreEl.style.display = 'none';
    return;
  }
  const start = Math.max(0, entries.length - RENDER_LIMIT);
  const visible = entries.slice(start).reverse();
  tbody.innerHTML = visible.map((e, i) => {
    const cls = (mode === 'new' && i === 0) ? 'new' : (e.synced ? '' : 'pending');
    const mark = e.synced ? '' : ' ⏳';
    const disp = e.display ? '<br><span class="disp">' + esc(e.display) + '</span>' : '';
    return '<tr class="' + cls + '"><td class="time">' + esc(e.time) + mark +
           '</td><td>' + esc(e.value) + disp + '</td></tr>';
  }).join('');
  if (entries.length > RENDER_LIMIT) {
    moreEl.textContent = 'Показаны последние ' + RENDER_LIMIT + ' из ' + entries.length + '.';
    moreEl.style.display = 'block';
  } else {
    moreEl.style.display = 'none';
  }
}
function setNumpad(v) {
  numpad.style.display = v ? 'block' : 'none';
  btnNumpad.classList.toggle('on', v);
  try { localStorage.setItem(NUMPAD_KEY, v ? '1' : '0'); } catch (e) {}
}
function toggleNumpad() {
  setNumpad(numpad.style.display === 'none');
  focusInput();
}
function toggleMenu(e) {
  e.stopPropagation();
  menu.classList.toggle('open');
}
document.addEventListener('click', e => {
  if (!menu.contains(e.target) && !e.target.classList.contains('b-menu')) {
    menu.classList.remove('open');
  }
});
function initNumpad() {
  document.querySelectorAll('.numpad-btn').forEach(btn => {
    btn.addEventListener('pointerdown', e => e.preventDefault());
    btn.addEventListener('click', async () => {
      const k = btn.dataset.k;
      if (k === 'bs') {
        input.value = input.value.slice(0, -1);
      } else if (k === 'enter') {
        const val = input.value.trim();
        if (val) await addEntry(val);
        else focusInput();
        return;
      } else {
        input.value += k;
      }
      focusInput();
    });
  });
  let saved = '0';
  try { saved = localStorage.getItem(NUMPAD_KEY) || '0'; } catch (e) {}
  setNumpad(saved === '1');
}
async function fetchCatalog() {
  try {
    const r = await fetchT('/api/catalog');
    if (r.status === 401) { location.href = '/'; return; }
    if (!r.ok) return;
    const d = await r.json();
    if (d.ok) {
      catalogRows = d.rows || {};
      catalogNameCol = d.name_col || '';
    }
  } catch (e) {}
}
async function fetchState() {
  try {
    const r = await fetchT('/api/state');
    if (r.status === 401) { location.href = '/'; return false; }
    if (!r.ok) return false;
    const d = await r.json();
    if (!d.ok) return false;
    employee = { code: d.employee_code, name: d.employee_name || '' };
    const pending = entries.filter(e => !e.synced);
    const server  = d.entries.map(e => ({ time: e.time, value: e.value,
                                          display: e.display || '', synced: true })).reverse();
    const keys    = new Set(server.map(e => e.time + '|' + e.value));
    const keep    = pending.filter(e => !keys.has(e.time + '|' + e.value));
    entries = server.concat(keep);
    saveEntries();
    render();
    return true;
  } catch (e) { return false; }
}
async function pushEntries(list) {
  statusSaving();
  try {
    const r = await fetchT('/api/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entries: list.map(e => ({
        time: e.time, value: e.value, display: e.display || '' })) })
    });
    if (r.status === 401) { location.href = '/'; return false; }
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) {
      list.forEach(e => e.synced = true);
      saveEntries();
      statusOk();
      return true;
    }
    statusOffline();
    return false;
  } catch (e) {
    statusOffline();
    return false;
  }
}
async function syncPending() {
  const pending = entries.filter(e => !e.synced);
  if (!pending.length) return true;
  const ok = await pushEntries(pending);
  render();
  return ok;
}
async function addEntry(value) {
  const display = lookup(value);
  const entry = { time: now(), value, display, synced: false };
  entries.push(entry);
  saveEntries();
  render('new');
  input.value = '';
  beep(true);
  focusInput();
  const ok = await pushEntries([entry]);
  if (ok) render();
}
async function undoLast() {
  if (!entries.length) return;
  const last = entries[entries.length - 1];
  const preview = last.value.length > 60 ? last.value.slice(0, 60) + '…' : last.value;
  if (!confirm('Удалить последнюю запись?\n\n' + last.time + '\n' + preview)) {
    focusInput(); return;
  }
  if (last.synced) {
    try {
      const r = await fetchT('/api/undo', { method: 'POST' });
      if (r.status === 401) { location.href = '/'; return; }
      const d = await r.json().catch(() => ({}));
      if (!(r.ok && d.ok) && d.error !== 'empty') {
        alert('Не удалось удалить на сервере'); return;
      }
    } catch (e) { alert('Нет связи с сервером'); return; }
  }
  entries.pop();
  saveEntries();
  render();
  beep(false);
  focusInput();
}
async function switchUser() {
  if (!confirm('Сменить пользователя?')) return;
  try { await fetchT('/api/logout', { method: 'POST' }); } catch (e) {}
  try {
    localStorage.removeItem(STORE);
    localStorage.removeItem(DIAG_KEY);
  } catch (e) {}
  location.href = '/';
}
input.addEventListener('keydown', async e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const val = input.value.trim();
    if (val) await addEntry(val);
  }
});
document.addEventListener('click', e => {
  const t = e.target;
  if (t.tagName === 'INPUT' || t.tagName === 'BUTTON' || t.tagName === 'A') return;
  if (t.closest && (t.closest('.numpad') || t.closest('.menu'))) return;
  focusInput();
});
window.addEventListener('focus', focusInput);
async function checkOnline() {
  try {
    const r = await fetchT('/api/ping');
    if (r.status === 401) { location.href = '/'; return false; }
    return r.ok;
  } catch (e) { return false; }
}
setInterval(async () => {
  const online = await checkOnline();
  if (online) {
    if (wasOffline) {
      wasOffline = false;
      queueDiag('offline_end');
      await flushDiag();
    }
    await syncPending();
    if (!entries.some(e => !e.synced)) statusOk();
  } else {
    if (!wasOffline) { wasOffline = true; queueDiag('offline_start'); }
    statusOffline();
  }
}, RETRY_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && entries.some(e => !e.synced)) syncPending();
});
(async function init() {
  loadEntries();
  loadDiag();
  render();
  initNumpad();
  input.focus();
  await fetchCatalog();
  const ok = await fetchState();
  if (!ok) {
    wasOffline = true;
    queueDiag('offline_start');
    statusOffline();
  } else {
    await syncPending();
    await flushDiag();
    statusOk();
  }
})();
</script>
</body>
</html>
